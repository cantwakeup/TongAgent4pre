[project]
name = "deepagents-learning-search-agent"
version = "0.1.0"
description = "A minimal real web research agent built while studying Deep Agents."
requires-python = ">=3.11,<4.0"
dependencies = [
    "deepagents",
    "langchain-openai>=1.1.0,<2.0.0",
    "langgraph-checkpoint-sqlite>=3.0.0,<4.0.0",
]

[tool.uv.sources]
deepagents = { path = "../../libs/deepagents", editable = true }

[[tool.uv.index]]
url = "https://pypi.tuna.tsinghua.edu.cn/simple"
default = true
